            border-radius: 14px;
            box-shadow: 0 5px 25px #00000012;
        }

        h1 {
            margin-top: 0;

        .subtitle {

            outline: 2px solid #163b32;

        button {
            width: 100%;

            border: none;
            border-radius: 7px;

            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 7px;
            overflow-wrap: anywhere;
        }

        #message.success,
        #message.error,
        #message.info {
            display: block;
        }

        #message.success {
            background: #dcfce7;
            color: #166534;
        }

        #message.error {
            background: #fee2e2;
            color: #991b1b;
        }

        #message.info {
            background: #e0f2fe;
            color: #075985;
        }

            display: block;
            margin-top: 22px;

            color: #163b32;

        }
    </style>
</head>

<body>
    <main class="login-card">
        <h1>Fill the Pockets</h1>
        <p class="subtitle">Administrator Login</p>

        <form id="adminLoginForm">
            <label for="email">Admin Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter admin email"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="loginBtn">
                Login as Admin
            </button>
        </form>

        <div id="message" role="status" aria-live="polite"></div>

        <a class="back-link" href="/villager-login.html">
            Back to Villager Login
        </a>
    </main>

    <script src="/js/api.js"></script>

    <script>
        const form = document.getElementById('adminLoginForm');
        const loginBtn = document.getElementById('loginBtn');
        const messageBox = document.getElementById('message');

        function showMessage(message, type) {
            messageBox.textContent = message;
            messageBox.className = type;
        }

        form.addEventListener('submit', async function (event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';

            showMessage(
                'Checking administrator credentials...',
                'info'
            );

            try {
                const response = await API.loginAdmin(email, password);
                const data = response.data || response;

                if (!data.token) {
                    throw new Error(
                        'No authentication token was returned by the server.'
                    );
                }

                if (data.role !== 'ADMIN') {
                    throw new Error(
                        'This account is not an administrator account.'
                    );
                }

                // Save authentication using the existing API helper.
                API.setToken(data.token);
                API.setUser(data);

                showMessage(
                    'Login successful! Opening dashboard...',
                    'success'
                );

                window.location.href = '/admin-dashboard.html';

            } catch (error) {
                showMessage(
                    error.message ||
                    'Login failed. Check your email and password.',
                    'error'
                );

                loginBtn.disabled = false;
                loginBtn.textContent = 'Login as Admin';
            }
        });
    </script>
</body>
</html>
