server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/fill_the_pockets?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# File Upload Settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
app.upload.dir=${APP_UPLOAD_DIR:uploads}

# Security & JWT Configuration
app.jwt.secret=9a7b6c5d4e3f2a1b0c9d8e7f6a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f8a7b
app.jwt.expiration-ms=86400000

# OTP & Demo Configuration
app.otp.expiration-seconds=300
app.otp.max-attempts=3
app.demo.mode=true
app.demo.default-password=Demo@Emp123

# AI Model Configuration
app.ai.model-path=src/main/resources/models/mobilenetv2-7.onnx
app.ai.confidence-threshold=0.70

# Static Resources
spring.web.resources.static-locations=classpath:/static/
